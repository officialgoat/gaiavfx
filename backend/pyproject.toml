[project]
name = "gaiavfx"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "GAIAVFX local application service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.15,<2",
    "filelock>=3.18,<4",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "pillow>=11,<13",
    "websockets>=15,<17",
    "tokenizers==0.22.2",
    "cryptography>=44,<50",
    "langfuse==4.15.4",
    "numpy>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyinstaller>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaiavfx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
