[[node_packs]]
name = "gaiavfx"
source = "local:comfy_nodes/gaiavfx"
classes = ["GaiaH3AudioVAE", "GaiaH3PowerShift", "GaiaH3LoraLoader", "GaiaH3MaskedSpan", "GaiaH3ContinuityTrim", "GaiaSaveSetGeometry", "GaiaSaveStillGeometry", "GaiaFaceScan", "GaiaFaceCheck"]
features = ["core", "recast", "stages"]
requirements = true
requirements_note = "Face nodes are optional outside Recast. Install insightface==2.1 and onnxruntime==1.30.0 in ComfyUI Python. InsightFace 2.1 publishes a universal wheel; if installation fails, use that wheel from PyPI and restart ComfyUI."
version = "0.1.0"

