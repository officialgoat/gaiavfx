# The closed registry of local engines (ADR 0015). Each engine:
#
#   [engines.<name>]
#   home = "<directory under the engines root>"
#   environment = "<its Python interpreter, relative to the home>"
#   worker = "<file under engine_workers/>"
#   programs = { <name> = "<native program the worker drives, relative to the home>" }
#   packages = { <package> = "<pinned version the probe checks>" }
#   [engines.<name>.tasks.<task>]
#   gpu = true | false
#   vram_gb = <estimate>
#   [[engines.<name>.models]]
#   path = "<relative to the home>"  sha256 = "<64 hex>"  bytes = <size>  source = "..."  licence = "..."
#
# `scripts/engine_setup.py` installs the homes outside the app (P2); the workers arrive with P3.
schema = 2

[engines.analysis]
home = "analysis"
environment = "env/Scripts/python.exe"
worker = "analysis.py"
packages = { torch = "2.7.1+cu128", torchaudio = "2.7.1+cu128", faster-whisper = "1.2.1", ctranslate2 = "4.8.3", speechbrain = "1.0.3", transformers = "5.19.0", onnxruntime-gpu = "1.22.0", audio-separator = "0.47.0", funasr = "1.4.16", numpy = "2.4.6", soundfile = "0.14.0", librosa = "0.11.0" }
# The 21 Oct smoke batch measured the card at about 11.4 GB above idle for separation and 1.7 GB for super-resolution
# (calibration/VOICE_ENGINE_SMOKES_2026-10-21.md); the other estimates held.
[engines.analysis.tasks.separate]
gpu = true
vram_gb = 12
[engines.analysis.tasks.transcribe]
gpu = true
vram_gb = 5
[engines.analysis.tasks.speakers]
gpu = true
vram_gb = 2
[engines.analysis.tasks.tag]
gpu = true
vram_gb = 2
[engines.analysis.tasks.filter]
gpu = true
vram_gb = 6
